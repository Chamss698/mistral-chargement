<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MistralRP - Chargement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--violet:#A855F7;--violet2:#7E22CE;--fond:#0b0418}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--fond);font-family:"Poppins",Arial,sans-serif;color:#fff;user-select:none}

  /* Clip en plein ecran */
  #clip{position:fixed;inset:0;overflow:hidden;background:#000}
  #player{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);pointer-events:none}
  #voile{position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(11,4,24,.92) 0%,rgba(11,4,24,.55) 28%,rgba(11,4,24,0) 50%),
               linear-gradient(0deg,rgba(11,4,24,.85) 0%,rgba(11,4,24,0) 30%)}

  /* Logo sur le cote */
  #logo{position:fixed;left:4vw;top:50%;transform:translateY(-55%);display:flex;flex-direction:column;align-items:flex-start;gap:1.2vh}
  #logo .m{width:11vh;height:11vh;border-radius:2.4vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#c084fc,#7e22ce);font:900 7vh/1 "Poppins",sans-serif;color:#fff;
    box-shadow:0 0 4vh rgba(168,85,247,.75);font-style:italic}
  #logo h1{font:900 8vh/1 "Poppins",sans-serif;letter-spacing:.3vh;text-shadow:0 0 3vh rgba(168,85,247,.8)}
  #logo h1 span{color:#d8b4fe}
  #logo p{font:700 1.7vh/1 "Poppins",sans-serif;letter-spacing:.5vh;color:#e9d5ff;text-transform:uppercase}

  /* Lecteur : pause + volume */
  #controles{position:fixed;right:3vw;top:4vh;display:flex;align-items:center;gap:1.4vh;padding:1.2vh 1.6vh;
    background:rgba(20,6,42,.75);border:1px solid rgba(168,85,247,.55);border-radius:1.4vh;box-shadow:0 0 2vh rgba(168,85,247,.35);backdrop-filter:blur(6px)}
  #controles button{width:5vh;height:5vh;border:none;border-radius:50%;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,#c084fc,#9333ea);box-shadow:0 0 1.4vh rgba(168,85,247,.7);display:flex;align-items:center;justify-content:center}
  #controles button svg{width:2.4vh;height:2.4vh;fill:#fff}
  #controles .titre{font:700 1.5vh/1.3 "Poppins",sans-serif;min-width:16vh}
  #controles .titre small{display:block;font-weight:500;color:#d8b4fe;font-size:1.25vh}
  #volume{-webkit-appearance:none;appearance:none;width:16vh;height:.6vh;border-radius:1vh;background:linear-gradient(90deg,var(--violet) var(--v,40%),rgba(255,255,255,.2) var(--v,40%));cursor:pointer}
  #volume::-webkit-slider-thumb{-webkit-appearance:none;width:1.8vh;height:1.8vh;border-radius:50%;background:#fff;box-shadow:0 0 1vh var(--violet)}
  #vol-txt{font:700 1.4vh/1 "Poppins",sans-serif;color:#e9d5ff;width:4.5vh;text-align:right}

  /* Chargement en bas */
  #chargement{position:fixed;left:4vw;right:4vw;bottom:5vh}
  #chargement .ligne{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.2vh}
  #etat{font:700 1.8vh/1 "Poppins",sans-serif;letter-spacing:.2vh;text-transform:uppercase;color:#e9d5ff}
  #pct{font:900 4.5vh/1 "Poppins",sans-serif;text-shadow:0 0 2vh rgba(168,85,247,.8)}
  #pct small{font-size:2vh;color:#d8b4fe}
  #barre{height:.8vh;border-radius:1vh;background:rgba(255,255,255,.12);overflow:hidden}
  #barre div{height:100%;width:0%;border-radius:1vh;background:linear-gradient(90deg,#7e22ce,#c084fc);box-shadow:0 0 1.5vh var(--violet);transition:width .4s ease}
</style>
</head>
<body>
  <div id="clip"><div id="player"></div></div>
  <div id="voile"></div>

  <div id="logo">
    <div class="m">M</div>
    <h1>MISTRAL<span>RP</span></h1>
    <p>Ta ville. Ton histoire.</p>
  </div>

  <div id="controles">
    <button id="lecture" title="Pause / Lecture">
      <svg id="ico-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      <svg id="ico-play" viewBox="0 0 24 24" style="display:none"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
    <div class="titre">Lagui<small>Maracanã</small></div>
    <input id="volume" type="range" min="0" max="100" value="40">
    <div id="vol-txt">40%</div>
  </div>

  <div id="chargement">
    <div class="ligne"><div id="etat">Connexion au serveur...</div><div id="pct">0<small>%</small></div></div>
    <div id="barre"><div></div></div>
  </div>

<script>
  var VIDEO_ID = "-EHSW-n8vhM";   // le clip
  var VOLUME_DEPART = 40;          // volume au depart (0 a 100)

  var player, enPause = false;
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady(){
    player = new YT.Player("player",{
      videoId: VIDEO_ID,
      playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0,playsinline:1,loop:1,playlist:VIDEO_ID,origin:location.origin},
      events:{
        onReady:function(e){ e.target.setVolume(VOLUME_DEPART); e.target.unMute(); e.target.playVideo(); },
        onStateChange:function(e){ if(e.data===YT.PlayerState.ENDED){ player.seekTo(0); player.playVideo(); } }
      }
    });
  }

  document.getElementById("lecture").onclick = function(){
    if(!player) return;
    enPause = !enPause;
    if(enPause){ player.pauseVideo(); } else { player.playVideo(); }
    document.getElementById("ico-pause").style.display = enPause ? "none" : "";
    document.getElementById("ico-play").style.display = enPause ? "" : "none";
  };

  var vol = document.getElementById("volume");
  function majVolume(){
    var v = parseInt(vol.value,10);
    vol.style.setProperty("--v", v + "%");
    document.getElementById("vol-txt").textContent = v + "%";
    if(player && player.setVolume){ player.setVolume(v); if(v>0) player.unMute(); }
  }
  vol.addEventListener("input", majVolume);
  vol.value = VOLUME_DEPART; majVolume();

  // Progression du chargement envoyee par FiveM
  var etapes = {INIT_CORE:"Chargement du jeu...",INIT_BEFORE_MAP_LOADED:"Chargement de la ville...",MAP:"Chargement de la ville...",INIT_AFTER_MAP_LOADED:"Preparation de ton arrivee...",INIT_SESSION:"Arrivee en ville..."};
  window.addEventListener("message", function(e){
    var d = e.data || {};
    if(d.eventName === "loadProgress"){
      var p = Math.round((d.loadFraction||0)*100);
      document.querySelector("#barre div").style.width = p + "%";
      document.getElementById("pct").innerHTML = p + "<small>%</small>";
    }
    if(d.eventName === "startInitFunctionOrder" && etapes[d.type]){
      document.getElementById("etat").textContent = etapes[d.type];
    }
  });
</script>
</body>
</html>
